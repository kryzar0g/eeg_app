experiment:
  subject_id: "S002_2class"
  session_id: "session_2class"
  trials_per_class: 30
  baseline_duration: 1.5
  cue_duration: 0.8
  imagery_duration: 3.0
  iti_duration: 1.5

lsl:
  eeg_stream_name: "EEG"
  eeg_stream_type: "EEG"
  marker_stream_name: "Markers"

paradigm:
  classes:
    LEFT: 1
    RIGHT: 2

preprocessing:
  sfreq: 250.0
  l_freq: 8.0
  h_freq: 30.0
  notch_freq: 50.0

features:
  bands:
    - [8.0, 12.0]
    - [12.0, 30.0]

classifier:
  algorithm: "lda"
  test_size: 0.2

events:
  mode: "csv"
  stim_channel: "STI 014"
  tmin: 0.0
  tmax: 4.0
  timestamp_csv_path: "data/timestamps.csv"
  epoch_length: 4.0
