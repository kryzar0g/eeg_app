experiment:
  subject_id: "S001"
  session_id: "session_001"
  # počet trialů na třídu
  trials_per_class: 40
  # délky intervalů v sekundách
  baseline_duration: 2.0
  cue_duration: 1.0
  imagery_duration: 4.0
  iti_duration: 2.0

lsl:
  eeg_stream_name: "EEG"
  eeg_stream_type: "EEG"
  marker_stream_name: "Markers"

paradigm:
  classes:
    UP: 1
    DOWN: 2
    LEFT: 3
    RIGHT: 4

preprocessing:
  sfreq: 250.0  # očekávaný vzorkovací kmitočet (Hz)
  l_freq: 8.0   # dolní mez band-pass filtru (Hz)
  h_freq: 30.0  # horní mez band-pass filtru (Hz)
  notch_freq: 50.0

features:
  bands:
    - [8.0, 12.0]
    - [12.0, 30.0]

classifier:
  type: "lda"  # "lda" nebo "svm"
  test_size: 0.2
  random_state: 42

events:
  # režim získávání událostí: "stim" (kanál v EDF/BDF) nebo "csv"
  mode: "csv"
  stim_channel: "STI 014"  # název stimulačního kanálu v EDF/BDF (pro mode="stim")
  tmin: 0.0                 # začátek epochy relativně k markeru (s, pro mode="stim")
  tmax: 4.0                 # konec epochy relativně k markeru (s, pro mode="stim")
  # CSV s časovými intervaly (start_seconds; end_seconds; label) pro mode="csv"
  timestamp_csv_path: "data/timestamps.csv"
  epoch_length: 4.0         # délka epochy v sekundách pro segmentaci intervalů
