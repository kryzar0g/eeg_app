experiment:
  subject_id: "S001"
  session_id: "session_001"
  # počet trialů na třídu
  trials_per_class: 36
  # délky intervalů v sekundách
  baseline_duration: 1.5
  cue_duration: 0.8
  imagery_duration: 3.0
  iti_duration: 1.5
  # ERP averaging: 1 = bez průměrování, >1 = průměrovat N opakování za sebou
  n_averages: 1

lsl:
  eeg_stream_name: "EEG"
  eeg_stream_type: "EEG"
  marker_stream_name: "Markers"
  resolution_timeout: 10.0
  # Sit: pridat IP adresu EEG zarizeni pro prime pripojeni pres sit.
  # Pokud je EEG na stejne lokalni siti, nechat prazdne (autodetekce).
  # Priklad pro zarizeni na jine podsiti: known_peers: ["192.168.1.100"]
  known_peers: []

paradigm:
  classes:
    UP: 1
    DOWN: 2
    LEFT: 3
    RIGHT: 4

preprocessing:
  sfreq: 250.0  # očekávaný vzorkovací kmitočet (Hz)
  l_freq: 8.0   # dolní mez band-pass filtru (Hz)
  h_freq: 30.0  # horní mez band-pass filtru (Hz)
  notch_freq: 50.0
  car: true

features:
  method: "fbcsp"
  bands:
    - [4.0, 8.0]
    - [8.0, 12.0]
    - [12.0, 30.0]
    - [30.0, 40.0]
  csp_components: 2
  fbcsp_top_k: 8

training:
  window_length_sec: 2.0
  crop_enabled: true
  crop_step_sec: 0.5

classifier:
  algorithm: "lda"  # "lda" nebo "svm"
  test_size: 0.2

events:
  # režim získávání událostí: "stim" (kanál v EDF/BDF) nebo "csv"
  mode: "csv"
  stim_channel: "STI 014"  # název stimulačního kanálu v EDF/BDF (pro mode="stim")
  tmin: 0.0                 # začátek epochy relativně k markeru (s, pro mode="stim")
  tmax: 4.0                 # konec epochy relativně k markeru (s, pro mode="stim")
  # CSV s časovými intervaly (start_seconds; end_seconds; label) pro mode="csv"
  timestamp_csv_path: "data/timestamps.csv"
  epoch_length: 4.0         # délka epochy v sekundách pro segmentaci intervalů
