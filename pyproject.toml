[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg_app"
version = "0.1.0"
description = "BCI aplikace pro rozpoznávání motorické imaginace z EEG signálů"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pylsl>=1.16.2",
  "mne>=1.7.0",
  "numpy>=1.23",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "psychopy>=2024.1",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.scripts]
eeg_app = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["config/*.yaml"]
